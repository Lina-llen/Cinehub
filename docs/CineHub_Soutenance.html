<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineHub — Présentation orale</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #190f33;
      --aubergine: #2b1b55;
      --cream: #fff4dc;
      --popcorn: #ffc633;
      --raspberry: #ff3e7f;
      --mint: #35e0b5;
      --muted: #c9c0d8;
      --line: rgba(255, 244, 220, 0.18);
      --shadow: 0 22px 65px rgba(0, 0, 0, 0.25);
      font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 86% 7%, rgba(255, 198, 51, 0.11), transparent 30%),
        radial-gradient(ellipse at 5% 90%, rgba(53, 224, 181, 0.08), transparent 28%),
        var(--night);
    }

    button {
      font: inherit;
    }

    .toolbar {
      position: sticky;
      z-index: 10;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.8rem clamp(1rem, 3vw, 2.5rem);
      border-bottom: 1px solid var(--line);
      background: rgba(25, 15, 51, 0.94);
      backdrop-filter: blur(12px);
    }

    .toolbar__brand {
      color: var(--cream);
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.16em;
    }

    .toolbar__brand span {
      color: var(--popcorn);
    }

    .toolbar__controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.55rem;
    }

    .control {
      padding: 0.55rem 0.85rem;
      color: var(--cream);
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      background: var(--aubergine);
      cursor: pointer;
    }

    .control:hover,
    .control[aria-pressed="true"] {
      color: var(--night);
      border-color: var(--popcorn);
      background: var(--popcorn);
    }

    .control--accent {
      color: var(--night);
      border-color: var(--popcorn);
      background: var(--popcorn);
      font-weight: 800;
    }

    .slide-count {
      min-width: 4.5rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: 1rem;
      width: min(100% - 2rem, 1500px);
      margin: 1.5rem auto 3rem;
    }

    .slide {
      position: relative;
      display: none;
      overflow: hidden;
      min-height: min(73vh, 810px);
      padding: clamp(1.5rem, 5vw, 4.5rem);
      border: 1px solid var(--line);
      border-radius: 1.4rem;
      background:
        linear-gradient(135deg, rgba(43, 27, 85, 0.97), rgba(25, 15, 51, 0.98));
      box-shadow: var(--shadow);
    }

    .slide.is-active {
      display: flex;
      flex-direction: column;
    }

    .slide::after {
      position: absolute;
      right: -9rem;
      bottom: -13rem;
      width: 28rem;
      height: 28rem;
      border: 1px solid rgba(255, 198, 51, 0.18);
      border-radius: 50%;
      box-shadow: 0 0 0 2.5rem rgba(255, 198, 51, 0.035), 0 0 0 5rem rgba(255, 198, 51, 0.025);
      content: "";
      pointer-events: none;
    }

    .slide__top,
    .slide__body,
    .slide__bottom {
      position: relative;
      z-index: 1;
    }

    .slide__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: clamp(1.5rem, 4vh, 3rem);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .slide__section {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
    }

    .slide__section::before {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--raspberry);
      box-shadow: 0 0 1rem rgba(255, 62, 127, 0.7);
      content: "";
    }

    .slide__number {
      color: var(--popcorn);
    }

    .slide__body {
      flex: 1;
    }

    .slide h1,
    .slide h2 {
      max-width: 1050px;
      margin: 0;
      font-family: "Unbounded", "Arial Black", "Segoe UI", sans-serif;
      font-size: clamp(2.1rem, 5vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -0.055em;
      line-height: 1.08;
    }

    .slide--title h1 {
      max-width: 900px;
      font-size: clamp(3.2rem, 9vw, 7rem);
      letter-spacing: -0.075em;
    }

    .slide--title h1 span {
      color: var(--popcorn);
    }

    .slide__lead {
      max-width: 900px;
      margin: 1.25rem 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.55rem);
      line-height: 1.55;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(var(--columns, 2), minmax(0, 1fr));
      gap: clamp(0.7rem, 1.4vw, 1.2rem);
      margin-top: clamp(1.5rem, 4vh, 3rem);
    }

    .card {
      min-height: 8.5rem;
      padding: clamp(1rem, 2vw, 1.45rem);
      border: 1px solid var(--line);
      border-top: 3px solid var(--card-accent, var(--popcorn));
      border-radius: 1rem;
      background: rgba(43, 27, 85, 0.78);
    }

    .card__eyebrow {
      margin-bottom: 0.5rem;
      color: var(--card-accent, var(--popcorn));
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .card h3 {
      margin: 0 0 0.55rem;
      font-size: clamp(1rem, 1.5vw, 1.28rem);
      line-height: 1.25;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.88rem, 1.1vw, 1rem);
      line-height: 1.5;
      white-space: pre-line;
    }

    .callout {
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      margin-top: clamp(1rem, 2.5vh, 1.8rem);
      padding: 0.9rem 1.1rem;
      border: 1px solid rgba(53, 224, 181, 0.35);
      border-left: 4px solid var(--mint);
      border-radius: 0.75rem;
      background: rgba(53, 224, 181, 0.07);
      color: var(--cream);
      font-size: clamp(0.85rem, 1.05vw, 0.98rem);
      line-height: 1.45;
    }

    .callout::before {
      color: var(--mint);
      font-size: 1.1rem;
      font-weight: 900;
      content: "→";
    }

    .callout--warning {
      border-color: rgba(255, 62, 127, 0.42);
      border-left-color: var(--raspberry);
      background: rgba(255, 62, 127, 0.08);
    }

    .callout--warning::before {
      color: var(--raspberry);
      content: "!";
    }

    .slide__bottom {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.75rem;
    }

    #liveNotes {
      display: none;
      align-self: stretch;
      padding: 1.4rem;
      border: 1px solid rgba(255, 198, 51, 0.35);
      border: 1px solid rgba(255, 198, 51, 0.45);
      border-radius: 1rem;
      background: var(--aubergine);
      box-shadow: var(--shadow);
      max-height: min(78vh, 850px);
      overflow-y: auto;
    }

    #liveNotes h2 {
      margin: 0 0 0.8rem;
      color: var(--popcorn);
      font-family: "Unbounded", "Arial Black", "Segoe UI", sans-serif;
      font-size: 1.05rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.5rem;
    }

    #liveNotes p {
      margin: 0 0 0.9rem;
      margin: 0 0 0.85rem;
      color: var(--cream);
      line-height: 1.58;
      line-height: 1.55;
      font-size: 0.95rem;
    }

    #liveNotes strong {
      color: var(--popcorn);
      font-weight: 700;
    }

    #liveNotes code {
      font-family: "Consolas", "Courier New", monospace;
      background: rgba(25, 15, 51, 0.75);
      border: 1px solid rgba(255, 198, 51, 0.2);
      padding: 0.12rem 0.35rem;
      border-radius: 0.3rem;
      color: var(--mint);
      font-size: 0.9em;
    }

    .guide-page strong {
      color: var(--popcorn);
    }

    .guide-page code {
      font-family: "Consolas", "Courier New", monospace;
      background: rgba(25, 15, 51, 0.75);
      border: 1px solid rgba(255, 198, 51, 0.2);
      padding: 0.12rem 0.35rem;
      border-radius: 0.3rem;
      color: var(--mint);
      font-size: 0.9em;
    }

    #liveNotes p:last-child {
      margin-bottom: 0;
    }

    .guide {
      display: none;
      width: min(100% - 2rem, 1100px);
      margin: 2rem auto 4rem;
    }

    .guide__intro,
    .guide-page {
      margin-bottom: 1rem;
      padding: clamp(1.25rem, 3vw, 2.25rem);
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--aubergine);
      box-shadow: var(--shadow);
    }

    .guide__intro h1,
    .guide-page h2 {
      margin: 0 0 1rem;
      color: var(--popcorn);
      font-family: "Unbounded", "Arial Black", "Segoe UI", sans-serif;
      line-height: 1.2;
    }

    .guide__intro h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
    }

    .guide-page h2 {
      font-size: clamp(1.2rem, 2.4vw, 1.65rem);
    }

    .guide p,
    .guide li {
      color: var(--cream);
      font-size: 1rem;
      line-height: 1.6;
    }

    .guide p {
      margin: 0 0 0.8rem;
    }

    .guide p:last-child {
      margin-bottom: 0;
    }

    .guide ul {
      margin: 0.5rem 0 1rem;
      padding-left: 1.25rem;
    }

    .guide li+li {
      margin-top: 0.35rem;
    }

    .guide__tag {
      margin-bottom: 0.6rem;
      color: var(--mint) !important;
      font-size: 0.74rem !important;
      font-weight: 900;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .guide__quote {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      border-left: 4px solid var(--popcorn);
      background: rgba(25, 15, 51, 0.65);
      color: var(--cream);
      font-style: italic;
      line-height: 1.55;
    }

    .guide code {
      padding: 0.08rem 0.32rem;
      border-radius: 0.25rem;
      background: var(--night);
      color: var(--popcorn);
      font-family: Consolas, monospace;
      font-size: 0.92em;
    }

    .guide__table-wrap {
      overflow-x: auto;
    }

    .guide table {
      width: 100%;
      border-collapse: collapse;
    }

    .guide th,
    .guide td {
      padding: 0.65rem;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .guide th {
      color: var(--popcorn);
    }

    .guide td {
      color: var(--cream);
    }

    .mode-presentation .stage {
      grid-template-columns: minmax(0, 1fr);
    }

    .mode-speaker .stage {
      grid-template-columns: minmax(0, 1.3fr) minmax(280px, 0.7fr);
    }

    .mode-speaker #liveNotes {
      display: block;
    }

    .mode-guide .stage {
      display: none;
    }

    .mode-guide .guide {
      display: block;
    }

    .mode-print-slides .toolbar,
    .mode-print-guide .toolbar {
      display: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .mode-speaker .stage {
        grid-template-columns: minmax(0, 1fr);
      }

      .mode-speaker #liveNotes {
        display: block;
      }

      .slide {
        min-height: 0;
      }

      .card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      }
    }

    @media (max-width: 600px) {
      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar__controls {
        justify-content: flex-start;
      }

      .stage {
        width: min(100% - 1rem, 1500px);
        margin-top: 0.5rem;
      }

      .slide {
        padding: 1.2rem;
        border-radius: 0.9rem;
      }

      .slide__top {
        margin-bottom: 1.4rem;
      }

      .card-grid {
        grid-template-columns: minmax(0, 1fr) !important;
      }

      .card {
        min-height: 0;
      }

      .slide__bottom {
        font-size: 0.65rem;
      }
    }

    @media print {
      body {
        min-width: 0;
        color: var(--cream);
        background: var(--night) !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .toolbar {
        display: none !important;
      }

      .stage {
        display: block;
        width: 100%;
        margin: 0;
      }

      .slide {
        display: flex !important;
        width: 100%;
        height: 100%;
        min-height: 0;
        aspect-ratio: 16 / 9;
        padding: 5%;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        break-after: page;
        page-break-after: always;
      }

      #liveNotes {
        display: none !important;
      }

      .mode-print-slides .guide {
        display: none !important;
      }

      .mode-print-slides .slide {
        display: flex !important;
      }

      .mode-print-guide .stage {
        display: none !important;
      }

      .mode-print-guide .guide {
        display: block !important;
        width: 100%;
        margin: 0;
      }

      .mode-print-guide .guide__intro,
      .mode-print-guide .guide-page {
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        break-after: page;
        page-break-after: always;
      }

      .mode-print-guide .guide__intro,
      .mode-print-guide .guide-page {
        background: var(--aubergine) !important;
      }

      .mode-print-guide .guide-page:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      .mode-print-guide .guide code {
        background: var(--night) !important;
      }
    }
  </style>
</head>

<body class="mode-presentation">
  <header class="toolbar" aria-label="Commandes de la présentation">
    <div class="toolbar__brand">CINE<span>HUB</span> · ORAL</div>
    <div class="toolbar__controls">
      <button class="control" id="modePresentation" type="button" aria-pressed="true">Présentation</button>
      <button class="control" id="modeSpeaker" type="button" aria-pressed="false">Notes orales</button>
      <button class="control" id="modeGuide" type="button" aria-pressed="false">Guide complet</button>
      <span class="slide-count" id="slideCount" aria-live="polite"></span>
      <button class="control" id="previousSlide" type="button" aria-label="Diapositive précédente">←</button>
      <button class="control" id="nextSlide" type="button" aria-label="Diapositive suivante">→</button>
      <button class="control control--accent" id="printCurrent" type="button">Imprimer / PDF</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <section class="deck" id="deck" aria-label="Diapositives"></section>
    <aside id="liveNotes" aria-live="polite"></aside>
  </main>
  <main class="guide" id="guide" aria-label="Guide de préparation à l'oral"></main>

  <script>
    const slides = [
      {
        section: "Présentation",
        title: "CINE<span>HUB</span>",
        titleHtml: true,
        lead: "Une application web pour consulter les films, choisir une séance et gérer des réservations — avec un espace d’administration.",
        cards: [
          { eyebrow: "Projet", title: "CineHub", body: "Gestion d’un cinéma\nFront React · API Express · MySQL", accent: "popcorn" },
          { eyebrow: "À l’oral", title: "Ce que je vais expliquer", body: "Parcours utilisateur, règles métier, architecture, sécurité et limites connues.", accent: "mint" },
          { eyebrow: "À l’oral", title: "Ce que je vais expliquer", body: "Parcours utilisateur, règles métier, architecture, sécurité et gestion du code.", accent: "mint" },
        ],
        callout: "Support en deux modes : « Présentation » pour projeter les slides, « Notes orales » ou « Guide complet » pour préparer le discours.",
        callout: "Support en deux modes : « Présentation » pour projeter les slides, « Notes orales » pour afficher ce guide concret pendant la soutenance.",
        notes: [
          "Ouvre avec le but fonctionnel plutôt qu’avec les technologies : CineHub relie un catalogue de films, des séances et des réservations.",
          "Annonce que tu vas d’abord montrer le parcours, puis expliquer comment les données circulent du navigateur jusqu’à MySQL. Garde la technique détaillée pour les questions.",
          "Le cahier des charges original n’est pas rangé dans le dépôt courant. Le bilan de conformité de ce support reprend les exigences recensées lors de la revue précédente et les demandes formulées ensuite; compare-le au document remis par ton école avant l’oral."
          "<strong>Ce que je dis :</strong> « Bonjour, je vous présente CineHub, une application web complète de gestion de cinéma qui relie un catalogue de films, des séances programmées en salles et les réservations de spectateurs, complétée par un espace d'administration. »",
          "<strong>Dans le code :</strong> Le projet est structuré en deux dossiers étanches : <code>front/</code> (React 19 propulsé par Vite) et <code>back/</code> (API REST avec Express 5 et MySQL).",
          "<strong>Fil conducteur :</strong> J'aborderai d'abord le parcours utilisateur et les règles métier, puis j'expliquerai concrètement comment les données transitent du navigateur jusqu'à la base MySQL."
        ],
        quote: "« CineHub permet à un utilisateur de trouver une séance et de réserver des places, tandis qu’un administrateur gère les principales données du cinéma. »"
      },
      {
        section: "01 · Besoin",
        title: "Deux profils, deux parcours",
        lead: "Le produit sépare les usages du spectateur et les opérations d’administration.",
        columns: 2,
        cards: [
          { eyebrow: "Spectateur", title: "Trouver et réserver", body: "Créer un compte, se connecter, découvrir les films, consulter les prochaines séances et réserver un nombre de places.", accent: "mint" },
          { eyebrow: "Spectateur", title: "Suivre son activité", body: "Voir ses réservations, les annuler, modifier son profil et consulter les séances dans le calendrier.", accent: "popcorn" },
          { eyebrow: "Administrateur", title: "Administrer", body: "Gérer les films et les utilisateurs, consulter les réservations et modifier le prix d’une séance.", accent: "raspberry" },
          { eyebrow: "Contrainte", title: "Aucune API cinéma externe", body: "Les films, les séances et les réservations viennent de la base locale; les affiches sont aussi hébergées par le backend.", accent: "mint" },
          { eyebrow: "Administrateur", title: "Administrer", body: "Gérer les films, salles et utilisateurs, ajouter ou supprimer des séances et modifier leur salle ou tarif.", accent: "raspberry" },
          { eyebrow: "Contrainte", title: "Aucune API cinéma externe", body: "Les films, séances et réservations sont stockés en local; les affiches sont hébergées par le backend.", accent: "mint" },
        ],
        callout: "Une réservation porte sur une séance, pas seulement sur un film : date, salle, prix et capacité sont attachés à la séance.",
        notes: [
          "Présente les deux rôles de façon concrète. Le spectateur navigue dans les films, choisit une séance, indique le nombre de places, puis retrouve la réservation dans son profil ou le calendrier.",
          "L’administrateur intervient sur des données plus sensibles. Le front masque les fonctions d’administration aux comptes classiques, et l’API vérifie aussi le rôle côté serveur.",

          "<strong>Deux rôles en base :</strong> La colonne <code>us_role</code> ('user' ou 'admin') dans la table <code>users</code> sépare les spectateurs des gestionnaires.",
          "<strong>Parcours spectateur :</strong> S'inscrit, se connecte, choisit une séance future, indique son nombre de places et retrouve ses billets dans son profil ou le calendrier.",
          "<strong>Parcours administrateur :</strong> Accède au panneau <code>/admin</code> pour ajouter/modifier/supprimer des films et des séances, changer la salle d'une séance existante et gérer les comptes utilisateurs.",
          "<strong>Contrainte forte :</strong> 100 % autonome, aucune dépendance vers une API tierce (TMDB ou Allociné). Toutes les données et images sont locales."
        ],
        quote: "Insiste sur la distinction entre film et séance : un même film peut avoir plusieurs dates, salles et prix."
      },
      {
        section: "02 · Architecture",
        title: "Du navigateur à la base",
        lead: "Chaque couche a une responsabilité et communique avec la suivante par une API HTTP.",
        columns: 4,
        cards: [
          { eyebrow: "1 · Interface", title: "React + Vite", body: "Pages, formulaires, navigation, états de chargement et retours utilisateur.", accent: "popcorn" },
          { eyebrow: "2 · Transport", title: "HTTP / JSON", body: "Axios appelle les routes Express; un JWT est envoyé en Bearer pour les routes protégées.", accent: "mint" },
          { eyebrow: "3 · Serveur", title: "Express", body: "Routes → contrôleurs → modèles. Les contrôleurs appliquent les règles métier.", accent: "raspberry" },
          { eyebrow: "4 · Persistance", title: "MySQL + fichiers", body: "MySQL garde les entités et chemins d’affiche; les fichiers images restent dans uploads/.", accent: "popcorn" },
          { eyebrow: "1 · Interface", title: "React + Vite", body: "Composants, hooks, formulaires contrôlés, états de chargement et retours utilisateur.", accent: "popcorn" },
          { eyebrow: "2 · Transport", title: "HTTP / Axios", body: "Appels asynchrones async/await; injection du JWT dans l'en-tête Authorization: Bearer.", accent: "mint" },
          { eyebrow: "3 · Serveur", title: "Express 5", body: "Routes → Middlewares (sécurité/rôle) → Contrôleurs (règles métier et validation).", accent: "raspberry" },

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderSlide(slide, index) {
      const title = slide.titleHtml ? slide.title : escapeHTML(slide.title);
      const cards = slide.cards.map((card) => `
        <article class="card" style="--card-accent: var(--${card.accent || "popcorn"})">
          <div class="card__eyebrow">${escapeHTML(card.eyebrow)}</div>
          <h3>${escapeHTML(card.title)}</h3>
          <p>${escapeHTML(card.body)}</p>
        </article>`).join("");
      const callout = slide.callout
        ? `<div class="callout">${escapeHTML(slide.callout)}</div>`
        : "";
      const warning = slide.warning
        ? `<div class="callout callout--warning">${escapeHTML(slide.warning)}</div>`
        : "";

      return `
        <article class="slide${index === 0 ? " is-active" : ""}${index === 0 ? " slide--title" : ""}"
          data-index="${index}" aria-label="Diapositive ${index + 1} : ${escapeHTML(slide.title.replace(/<[^>]*>/g, ""))}">
          <div class="slide__top">
            <span class="slide__section">${escapeHTML(slide.section)}</span>
            <span class="slide__number">${String(index + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}</span>
          </div>
          <div class="slide__body">
            <h1>${title}</h1>
            <p class="slide__lead">${escapeHTML(slide.lead)}</p>
            <div class="card-grid" style="--columns:${slide.columns || 2}">
              ${cards}
            </div>
            ${callout}
            ${warning}
          </div>
          <div class="slide__bottom">
            <span>CINEHUB · Présentation du projet</span>
            <span>Front React · API Express · MySQL</span>
          </div>
        </article>`;
    }

    function renderGuidePage(item, index) {
      const paragraphs = (item.paragraphs || [])
        .map((paragraph) => `<p>${escapeHTML(paragraph)}</p>`).join("");
      const qa = (item.qa || []).map(([question, answer]) => `
        <p><strong>${escapeHTML(question)}</strong><br>${escapeHTML(answer)}</p>`).join("");
      const table = item.table
        ? `<div class="guide__table-wrap"><table>${item.table.map((row, rowIndex) => `
            <tr>${row.map((cell) => rowIndex === 0
          ? `<th>${escapeHTML(cell)}</th>`
          : `<td>${escapeHTML(cell)}</td>`).join("")}</tr>`).join("")}</table></div>`
        : "";
      return `
        <section class="guide-page">
          <div class="guide__tag">Guide oral · ${String(index + 1).padStart(2, "0")}</div>
          <h2>${escapeHTML(item.title)}</h2>
          ${paragraphs}${table}${qa}
        </section>`;
    }

          <div class="guide__tag">Document présentatrice · version détaillée</div>
          <h1>CineHub — Guide de soutenance</h1>
          <p>Les diapositives sont volontairement synthétiques. Cette vue contient le discours, les explications techniques, les limites à reconnaître et des réponses possibles aux questions.</p>
          <p><strong>Clavier :</strong> ← / → pour naviguer, Espace pour avancer, N pour les notes, G pour le guide, P pour imprimer.</p>
        </section>
        ${slides.map((slide, index) => `
          <section class="guide-page">
            <div class="guide__tag">Diapositive ${String(index + 1).padStart(2, "0")} · ${escapeHTML(slide.section)}</div>
            <h2>${escapeHTML(slide.title.replace(/<[^>]*>/g, ""))}</h2>
            ${slide.notes.map((paragraph) => `<p>${escapeHTML(paragraph)}</p>`).join("")}
            ${slide.notes.map((paragraph) => `<p>${paragraph}</p>`).join("")}
            <div class="guide__quote">${escapeHTML(slide.quote)}</div>
          </section>`).join("")}
        ${extraGuide.map(renderGuidePage).join("")}
        <section class="guide-page">
          <div class="guide__tag">Ressource comparée</div>
          <h2>Front de référence</h2>
          <p><a href="https://github.com/TheoGeneste/events_front_aout_2026" style="color:var(--popcorn)">TheoGeneste/events_front_aout_2026</a> — branche main consultée le 20 novembre 2026.</p>
          <p>Fichiers regardés pour la comparaison : App.jsx, main.jsx, EventsPage.jsx, LoginPage.jsx, AuthWrapper.jsx et eventsServices.js.</p>
          <p>Cette comparaison porte uniquement sur le front, conformément à la demande. Elle ne prétend pas être une revue complète du backend de ce dépôt exemple.</p>
        </section>`;
      showSlide(0);
      const params = new URLSearchParams(location.search);
      if (params.get("pdf") === "slides") {
        setMode("print-slides");
      } else if (params.get("pdf") === "guide") {
        setMode("print-guide");
      } else if (params.get("view") === "guide") {
        setMode("guide");
      }
    }

    function showSlide(index) {
      activeIndex = (index + slides.length) % slides.length;
      deck.querySelectorAll(".slide").forEach((slide, slideIndex) => {
        slide.classList.toggle("is-active", slideIndex === activeIndex);
      });
      liveNotes.innerHTML = `
        <h2>Notes · ${String(activeIndex + 1).padStart(2, "0")} / ${slides.length}</h2>
        ${slides[activeIndex].notes.map((paragraph) => `<p>${escapeHTML(paragraph)}</p>`).join("")}
        ${slides[activeIndex].notes.map((paragraph) => `<p>${paragraph}</p>`).join("")}
        <div class="guide__quote">${escapeHTML(slides[activeIndex].quote)}</div>`;
      slideCount.textContent = `${String(activeIndex + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}`;
      document.getElementById("previousSlide").disabled = activeIndex === 0;
      document.getElementById("nextSlide").disabled = activeIndex === slides.length - 1;
    }

    function setMode(mode) {
      currentMode = mode;
      document.body.className = `mode-${mode}`;
      document.getElementById("modePresentation").setAttribute("aria-pressed", String(mode === "presentation"));
      document.getElementById("modeSpeaker").setAttribute("aria-pressed", String(mode === "speaker"));
      document.getElementById("modeGuide").setAttribute("aria-pressed", String(mode === "guide"));
    }

    document.getElementById("previousSlide").addEventListener("click", () => showSlide(activeIndex - 1));
    document.getElementById("nextSlide").addEventListener("click", () => showSlide(activeIndex + 1));
    document.getElementById("modePresentation").addEventListener("click", () => setMode("presentation"));
    document.getElementById("modeSpeaker").addEventListener("click", () => setMode("speaker"));
    document.getElementById("modeGuide").addEventListener("click", () => setMode("guide"));
    document.getElementById("printCurrent").addEventListener("click", () => window.print());
    document.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) return;
      if (event.key === "ArrowRight" || event.key === " ") showSlide(activeIndex + 1);
      if (event.key === "ArrowLeft") showSlide(activeIndex - 1);
      if (event.key.toLowerCase() === "n") setMode(currentMode === "speaker" ? "presentation" : "speaker");
      if (event.key.toLowerCase() === "g") setMode(currentMode === "guide" ? "presentation" : "guide");
      if (event.key.toLowerCase() === "p") window.print();
    });

    render();
  </script>
</body>

</html>
